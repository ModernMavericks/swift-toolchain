name: release

# Build the pinned host build environment for ModernMavericks/swift-runtime and publish it as
# relocatable, SHA-verified release assets.
#
# The gate (verify-relocatable.sh) unpacks the SHIPPED TARBALL into a directory other than the
# one it was built in, then configures AND builds libswiftCore against it, asserting minOS 10.9.
# That is the regression this repo exists to prevent: a CMake build tree bakes absolute paths at
# configure time, so reusing one after a checkout-path change (a repo rename, a fork, a
# different runner layout) silently breaks with a confusing LLVMInstallSymlink error.
#
# Tags ARE the version -- no `v` prefix. See VERSION.

on:
  push:
    branches: ['**']            # regular build on every push, so breaks surface off the release path
    tags: ['*-mavericks.*']     # a tag always publishes
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut and publish a repackage of the shipped upstream (-mavericks.N+1)"
        type: boolean
        default: false

permissions:
  contents: write

# Each tag is a unique ref, so a publish is never cancelled by a later one -- and must not be: two
# publishes racing the same tag is a corrupt release, not a flaky build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26   # Apple Silicon (arm64) — mirrors local Tahoe; use macos-15 if unavailable
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version is derived from the shipped *-mavericks.* tags

      # build-llvm.sh / verify-relocatable.sh fetch pinned sources via shared-cmake's clone_pinned.sh,
      # and Artifact conformance uses $MSC_SCRIPTS -- both need shared-cmake installed here (the action
      # exports $MSC_SCRIPTS for every later step).
      - name: Install mavericks-shared-cmake
        uses: ModernMavericks/shared-cmake/.github/actions/install@v1

      # The version is DERIVED, so there is nothing for a tag to disagree with. What this replaces --
      # "tag must equal the committed VERSION" -- made every release a two-step ritual: edit VERSION,
      # commit to main, then tag. Bots cannot do the commit (branch protection requires a status check
      # a fresh commit has not got), which is why this repo never joined the automated release path.
      - name: Derive the upstream version from the pin
        run: sh scripts/derive-upstream-version.sh

      # Three ways to publish, matching the rest of the family:
      #   - a *-mavericks.* tag: VER = the tag (a hand-cut release).
      #   - workflow_dispatch(local_release=true): a REPACKAGE of the shipped upstream, N+1.
      #     Dispatched by repackage-on-ingredient-bump.yml when an ingredient pin moves.
      #   - a push to main whose upstream has no release yet: auto-cut N=1. This is how a Renovate
      #     SWIFT_VERSION bump ships -- version.sh says RELEASE=yes exactly when this upstream has no
      #     tag, so there is nothing extra to detect and no second workflow to keep in step.
      # Anything else builds and gates without publishing.
      - name: Resolve the version + decide whether this run publishes
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VER="${GITHUB_REF_NAME}"; PUBLISH=true
          else
            mode=auto
            if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${{ inputs.local_release }}" = "true" ]; then
              mode=local
            fi
            out="$(sh "$MSC_SCRIPTS/version.sh" "$mode")"
            VER="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
            REL="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
            if [ "$mode" = local ]; then
              PUBLISH=true
            elif [ "$REL" = yes ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              PUBLISH=true            # new upstream, first release
            else
              PUBLISH=false
            fi
          fi
          printf '%s\n' "$VER" > VERSION     # a build product; every later step reads this one
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VER publish=$PUBLISH"

      - name: Build the relocatable LLVM build-support tree
        run: ./build-llvm.sh

      - name: Mirror the swift.org toolchain (verbatim; signature must match upstream)
        run: ./mirror-toolchain.sh

      - name: Package assets + SHA256SUMS
        run: ./package.sh

      - name: GATE — relocate, then configure AND build libswiftCore (must pass)
        run: ./verify-relocatable.sh

      # The body travels IN the artifact: publish-release.yml does not check out the repo, so one rule
      # works whether the notes are committed (here) or generated (tailscale).
      - name: Stage the release notes
        run: |
          set -eu
          VER="${{ steps.ver.outputs.version }}"   # the version this run resolved, not a re-read
          mkdir -p dist
          if [ -s "release-notes/$VER.md" ]; then
            cp "release-notes/$VER.md" dist/RELEASE_NOTES.md
          else
            printf '## %s\n\nAutomated release of the pinned Swift build environment.\n' "$VER" > dist/RELEASE_NOTES.md
          fi

      # Conformance: do the artifacts about to be published agree with each other and with the
      # family's schemes? Gated on a tag, which is when this repo publishes -- a plain push builds
      # without producing the appcast this asks about.
      - name: Artifact conformance
        if: steps.ver.outputs.publish == 'true'
        run: |
          sh "$MSC_SCRIPTS/artifact-facts.sh" dist "${{ steps.ver.outputs.version }}" \
            | sh "$MSC_SCRIPTS/check-artifact-conformance.sh"

      # No SHA256SUMS in the artifact: publish-release.yml regenerates it over everything it attaches.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: swift-toolchain
          path: |
            dist/*.tar.gz
            dist/*.pkg
            dist/RELEASE_NOTES.md

  publish:
    needs: [build]
    if: needs.build.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ModernMavericks/shared-cmake/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.version }}
      artifact: swift-toolchain
